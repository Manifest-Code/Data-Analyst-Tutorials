<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birth Weight Form</title>
    <style>
        /* General Body Styling */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8; /* Light gray-blue background */
            background-image: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding-top: 50px; /* Margin from the top */
        }

        /* Heading Styling */
        h1 {
            color: #2c3e50;
            font-weight: 600;
            margin-bottom: 20px;
            text-align: center;
        }

        /* Form Container */
        form {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px; /* Fixed width for better appearance */
            box-sizing: border-box;
        }

        /* Label Styling */
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #34495e;
            font-size: 14px;
        }

        /* Input Styling */
        input[type="number"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #d1d9e6;
            border-radius: 8px;
            box-sizing: border-box; /* Ensures padding doesn't affect width */
            font-size: 16px;
            transition: all 0.3s ease;
            outline: none;
        }

        /* Highlight inputs on focus */
        input[type="number"]:focus {
            border-color: #4facfe;
            box-shadow: 0 0 8px rgba(79, 172, 254, 0.3);
        }

        /* Submit Button Styling (Added for functionality) */
        button {
            width: 100%;
            background-color: #4facfe;
            background-image: linear-gradient(to right, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            margin-top: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(79, 172, 254, 0.4);
        }

        button:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <h1>Predict Birth Weight</h1>

    <form action='/predict' method='POST'>
        <label for="gestation">Gestation (Weeks)</label>
        <input name="gestation" id="gestation" type="number" placeholder="e.g. 38" required>

        <label for="parity">Parity</label>
        <input name="parity" id="parity" type="number" placeholder="Total previous pregnancies" required>

        <label for="age">Mother's Age</label>
        <input name="age" id="age" type="number" placeholder="Years" required>

        <label for="height">Height (cm)</label>
        <input name="height" id="height" type="number" placeholder="e.g. 165" required>

        <label for="weight">Weight (kg)</label>
        <input name="weight" id="weight" type="number" placeholder="Pre-pregnancy weight" required>

        <label for="smoke">Smoke Status (0 or 1)</label>
        <input name="smoke" id="smoke" type="number" placeholder="0 = No, 1 = Yes" required>

        <button type="submit">Calculate Prediction</button>
    </form>
    <h3>Predicted Birth Weight: {{ prediction }}</h3>
</body>
</html>
